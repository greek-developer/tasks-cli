name: Publish NuGet

on:
  push:
    branches:
      - release/production

permissions:
  contents: write

jobs:
  publish:
    name: Publish Nugets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Nerdbank.GitVersioning can compute the git height

      - name: Setup Build Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Derives the version from version.json + git height and exports it to the
      # steps below as NBGV_* environment variables. The build itself picks the
      # version up automatically via the Nerdbank.GitVersioning package.
      - name: Set Version
        run: |
          dotnet tool install --global nbgv --version 3.10.91
          nbgv cloud -a

      - name: Restore Project Dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build -c Release --no-restore

      - name: Pack Project
        run: dotnet pack -c Release --no-build -o ./artifacts

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${NBGV_SimpleVersion}
          git push origin v${NBGV_SimpleVersion}

      - name: Publish NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
